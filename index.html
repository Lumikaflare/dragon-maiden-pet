<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小龙娘 · 动画素材预览</title>
<style>body{margin:0;background:#121724;color:#f5f1ff;font:16px system-ui,'Microsoft Yahei'}main{max-width:1120px;margin:auto;padding:32px}h1{font-size:30px}p{color:#c8bfd7;line-height:1.7}button,select{background:#342c49;color:#fff;border:1px solid #645375;border-radius:9px;padding:10px 16px;font:inherit;cursor:pointer}button:hover{background:#4a3d62}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}.card{background:#202538;border-radius:18px;padding:20px}.stage{display:flex;align-items:center;justify-content:center;border-radius:12px;background:#202b40;min-height:330px}.stage canvas{width:288px;height:312px}input{width:100%;accent-color:#b497ef}.status{display:flex;justify-content:space-between;margin:12px 0}img{max-width:100%;border-radius:10px}a{color:#d5bfff}.links{display:flex;gap:18px;flex-wrap:wrap}summary{cursor:pointer;padding:14px 0}video{max-width:100%;border-radius:10px}</style>
<main><h1>小龙娘 · 动画素材预览</h1><p>左右飞行分别制作，保留不对称服饰与远端翅膀。招呼、起飞、待机、聆听和思考保留原作素材；失落、检查和看向动作采用原生透明。可暂停逐帧查看，也可切换背景检查轮廓。</p>
<div class="controls"><button id="play">暂停</button><button data-bg="#202b40">深色背景</button><button data-bg="#fff">白色背景</button><button data-bg="#8b8b8b">灰色背景</button></div>
<div class="grid"><section class="card"><h2>九种动作</h2><div class="controls"><label for="state">动作</label><select id="state"><option value="0">待机</option><option value="1">向右飞</option><option value="2">向左飞</option><option value="3">招呼（原说话）</option><option value="4">起飞（原素材）</option><option value="5">失落与恢复</option><option value="6">等待回应</option><option value="7">思考工作</option><option value="8">检查确认</option></select></div><div class="stage"><canvas id="motion" width="192" height="208" aria-label="动作播放"></canvas></div><div class="status"><span id="motion-label">待机</span><span id="frame-label"></span></div><input id="frame" type="range" min="0" max="5" value="0" aria-label="动作帧"></section>
<section class="card"><h2>看向十六个方向</h2><p>身体保持正面，由头部和视线转向。</p><div class="stage"><canvas id="look" width="192" height="208" aria-label="视线播放"></canvas></div><div class="status"><span id="look-label"></span><span id="look-frame-label"></span></div><input id="look-frame" type="range" min="0" max="15" value="0" aria-label="看向方向"></section></div>
<h2>完整播放</h2><div class="grid"><section class="card"><h3>全部动作</h3><img src="previews/final/all-states.gif" alt="九种动作连续播放"></section><section class="card"><h3>待机 → 起飞 → 待机</h3><div class="stage"><img src="previews/final/idle-jump-idle.gif" width="288" alt="待机起飞衔接播放"></div></section><section class="card"><h3>视线循环</h3><img src="previews/final/look-loop.gif" alt="十六个方向循环"></section></div>
<h2>静帧对照</h2><img src="previews/final/four-stills.png" alt="待机、招呼、起飞、思考静帧"><details><summary>查看所有动作和方向</summary><img src="qa/contact-sheet-final.png" alt="所有动作帧"><img src="qa/direction-sheet.png" alt="方向对照"></details><details><summary>播放视频</summary><video controls preload="metadata" src="previews/final/all-states.mp4"></video></details><p class="links"><a href="previews/final/all-states.gif" download>保存动作 GIF</a><a href="previews/final/all-states.mp4" download>保存动作视频</a><a href="final/spritesheet-extended.png" download>保存透明桌宠素材</a></p><p id="load-status" role="status">正在载入素材…</p></main>
<script>
const atlas=new Image(),counts=[6,8,8,4,5,8,6,6,6],names=['待机','向右飞','向左飞','招呼','起飞','失落与恢复','等待回应','思考工作','检查确认'],directions=['向上','向右上','向右上','向右上','向右','向右下','向右下','向右下','向下','向左下','向左下','向左下','向左','向左上','向左上','向左上'];
const motion=document.querySelector('#motion').getContext('2d'),look=document.querySelector('#look').getContext('2d'),frame=document.querySelector('#frame'),lookFrame=document.querySelector('#look-frame'),state=document.querySelector('#state');let playing=true,ready=false,lookTick=0;
function drawCell(ctx,row,col){ctx.clearRect(0,0,192,208);ctx.drawImage(atlas,col*192,row*208,192,208,0,0,192,208)}
function render(){if(!ready)return;const r=Number(state.value),f=Number(frame.value),l=Number(lookFrame.value);drawCell(motion,r,f);drawCell(look,9+Math.floor(l/8),l%8);document.querySelector('#motion-label').textContent=names[r];document.querySelector('#frame-label').textContent=`第 ${f+1} / ${counts[r]} 帧`;document.querySelector('#look-label').textContent=directions[l];document.querySelector('#look-frame-label').textContent=`${l*22.5}°`}
function pause(){playing=false;document.querySelector('#play').textContent='播放'}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停':'播放'};state.onchange=()=>{frame.max=counts[Number(state.value)]-1;frame.value=0;render()};frame.oninput=()=>{pause();render()};lookFrame.oninput=()=>{pause();render()};document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>document.querySelectorAll('.stage').forEach(s=>s.style.background=b.dataset.bg));
atlas.onload=()=>{ready=true;document.querySelector('#load-status').textContent='素材已载入，可逐帧查看。';render()};atlas.onerror=()=>document.querySelector('#load-status').textContent='素材载入失败，请刷新重试。';atlas.src='final/spritesheet-extended.png';setInterval(()=>{if(!playing||!ready)return;frame.value=(Number(frame.value)+1)%counts[Number(state.value)];if(++lookTick%2===0)lookFrame.value=(Number(lookFrame.value)+1)%16;render()},160);
</script></html>
